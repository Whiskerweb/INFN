<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration · Assistant IA DMN · INFN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- Connexion -->
<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="off">
    <img src="/wp-content/uploads/2019/09/logo_signature_dark.svg" alt="INFN, la grande école du notariat">
    <h1>Espace administrateur</h1>
    <p class="sub">Assistant IA de la page Diplôme des métiers du notariat</p>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" required autofocus placeholder="••••••">
      <button type="button" class="eye" id="eye" aria-label="Afficher le mot de passe"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="btn-primary" id="loginBtn">Se connecter <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="login-err" id="loginErr" role="alert"></div>
    <div class="login-foot"><span>Accès réservé à l'INFN</span><span>Snipia</span></div>
  </form>
</section>

<!-- Application -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <img src="/wp-content/uploads/2019/09/logo_signature_dark.svg" alt="INFN">
      <span class="brand-tag"><i></i>Assistant IA · DMN</span>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-l">Pilotage</div>
      <button data-view="overview" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg><span class="l">Vue d'ensemble</span></button>
      <button data-view="analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="l">Analytics</span></button>
      <button data-view="questions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span class="l">Questions</span><span class="count num" id="navAll" style="background:var(--line2);color:var(--mute)">0</span></button>
      <button data-view="gaps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="l">À enrichir</span><span class="count num" id="navGaps">0</span></button>
      <div class="nav-l">Communication</div>
      <button data-view="comm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span class="l">Récap com'</span></button>
    </nav>
    <div class="side-foot">
      <div class="mode" id="mode" title="Source des données"><button data-mode="real">Données réelles</button><button data-mode="demo">Démo</button></div>
      <div class="me"><span class="av">INFN</span><div><b>Administrateur</b><small>Communication INFN</small></div><button id="logout" aria-label="Se déconnecter" title="Se déconnecter"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg></button></div>
      <div class="powered">Propulsé par <b>Snipia</b> · données hébergées en UE</div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div><h1 id="title">Vue d'ensemble</h1><div class="range" id="range">—</div></div>
      <div class="tools">
        <span class="updated" id="updated"></span>
        <div class="seg" id="period">
          <button data-p="7" class="on">7 jours</button><button data-p="30">30 jours</button><button data-p="90">90 jours</button><button data-p="0">Tout</button>
        </div>
        <button class="btn" id="refresh" title="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>Actualiser</button>
        <button class="btn" id="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Exporter CSV</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
